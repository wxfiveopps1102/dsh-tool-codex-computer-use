name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: node --check index.js

      - name: Validate DSH bundle manifest
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(pkg.dsh?.bundle?.patch, './cordis.patch.yml',
            'package.json dsh.bundle.patch must point to ./cordis.patch.yml');
          assert.ok(fs.statSync(pkg.dsh.bundle.patch).isFile(),
            'cordis.patch.yml must exist and be a file');
          NODE

      - name: Check npm package contents
        run: npm pack --dry-run
